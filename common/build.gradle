architectury {
    common rootProject.enabled_platform.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/saintsdragons.accesswidener")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    // Mappings
    mappings loom.officialMojangMappings()

    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // GeckoLib common
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // JSR305 for @Nullable/@Nonnull annotations
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}
