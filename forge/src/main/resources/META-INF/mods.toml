modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
logoFile="assets/saintsdragons/saintsdragons.png"

[[mods]]
modId="saintsdragons"
version="${version}"
displayName="Saint's Dragons"
description='''
Adds animated dragons or wyverns or whatever the heck you wanna call them flying reptiles to Minecraft.
'''
authors="Leon Saint"

[[dependencies.saintsdragons]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

# NeoForge 1.20.1 exposes a virtual "forge" mod for backwards compatibility, so this jar
# already loads unmodified there. This entry is informational only (mandatory=false) so
# storefronts/tooling that scan mods.toml recognize NeoForge as a supported loader, without
# affecting load behavior on either Forge or NeoForge.
[[dependencies.saintsdragons]]
modId="neoforge"
mandatory=false
versionRange="[47.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.saintsdragons]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.saintsdragons]]
modId="geckolib"
mandatory=true
versionRange="[4.8.1,)"
ordering="BEFORE"
side="BOTH"
